<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Returning to the app…</title>
<style>
  :root { color-scheme: light dark; }
  body {
    max-width: 26rem;
    margin: 0 auto;
    padding: 5rem 1.5rem;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #16202f;
    background: #fff;
    text-align: center;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #dfe6f2; background: #0d1420; }
    .btn { background: #8fb8e8 !important; color: #0d1420 !important; }
    .muted { color: #8494ac !important; }
  }
  h1 { font-size: 1.35rem; margin: 0 0 .6rem; }
  .muted { color: #5b6b85; font-size: .95rem; }
  .btn {
    display: inline-block;
    margin-top: 1.6rem;
    padding: .8rem 1.5rem;
    border-radius: 9px;
    background: #1d4ed8;
    color: #fff;
    text-decoration: none;
    font-weight: 600;
  }
</style>
</head>
<body>
<h1 id="title">Returning to the app…</h1>
<p class="muted" id="status">You can close this page if the app has already opened.</p>
<a class="btn" id="open" href="musicmergers://checkout-complete">Open the app</a>
<script>
  // Stripe returns here (checkout success/cancel, billing portal). Forward the
  // same query to the app, whose checkout sheet is waiting for this link.
  (function () {
    var allowed = ['status', 'session_id'];
    var src = new URLSearchParams(window.location.search);
    var out = new URLSearchParams();
    allowed.forEach(function (k) { if (src.get(k)) out.set(k, src.get(k)); });
    var target = 'musicmergers://checkout-complete' + (out.toString() ? '?' + out.toString() : '');
    document.getElementById('open').setAttribute('href', target);
    if (src.get('status') === 'success') {
      document.getElementById('title').textContent = 'Payment complete';
    }
    window.location.replace(target);
  })();
</script>
</body>
</html>
